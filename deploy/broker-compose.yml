# From the repository root, add this overlay to deploy/docker-compose.yml:
# docker compose -f deploy/docker-compose.yml -f deploy/broker-compose.yml up -d --build
# Same-host process resilience, not physical-host redundancy.
# Both services use the project's default private network and the SAME SQLite volume.
services:
  ccfleet-broker:
    image: ccfleetd:local
    container_name: ccfleet-broker
    restart: unless-stopped
    env_file: ccfleetd.env
    environment:
      CCFLEET_BROKER_ONLY: "1"
      CCFLEET_GATEWAY_ENABLED: "false"
      CCFLEET_PUBLIC_MACHINE_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:8113:8110"
    volumes:
      - ccfleet-data:/data
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
