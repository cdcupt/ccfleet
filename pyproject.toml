[project]
name = "ccfleet"
version = "0.1.0"
description = "Own-account Claude Code fleet manager: one owner, one account, one node."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Daichen Chai"}]
dependencies = []

[project.scripts]
ccfleetd = "ccfleetd.cli:main"
ccfleet-agent = "ccfleet_agent.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ccfleetd", "ccfleet_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP007", "UP045"]  # keep Optional[...] for Python 3.9 readers

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["ccfleetd", "ccfleet_agent"]
omit = ["ccfleetd/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
